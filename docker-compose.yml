services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shorts
      POSTGRES_PASSWORD: shorts_local
      POSTGRES_DB: shorts
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shorts -d shorts']
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: { context: ., dockerfile: infra/Dockerfile }
    profiles: ['app']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shorts:shorts_local@postgres:5432/shorts
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: { context: ., dockerfile: infra/Dockerfile }
    profiles: ['app']
    env_file: .env
    environment: &app_env
      DATABASE_URL: postgresql://shorts:shorts_local@postgres:5432/shorts
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      STORAGE_ROOT: /app/.data/storage
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    command: ['npm', 'run', 'start:api']
    volumes: ['media_data:/app/.data']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    init: true
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
  worker:
    build: { context: ., dockerfile: infra/Dockerfile }
    profiles: ['app']
    env_file: .env
    environment: *app_env
    command: ['npm', 'run', 'start:worker']
    volumes: ['media_data:/app/.data']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 2
    security_opt: ['no-new-privileges:true']
  renderer:
    build: { context: ., dockerfile: infra/Dockerfile }
    profiles: ['app']
    env_file: .env
    environment: *app_env
    command: ['npm', 'run', 'start:renderer']
    volumes: ['media_data:/app/.data']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    init: true
    mem_limit: 4g
    cpus: 2
    security_opt: ['no-new-privileges:true']
  web:
    build: { context: ., dockerfile: infra/Dockerfile, target: web }
    profiles: ['app']
    ports: ['127.0.0.1:5173:80']
    depends_on: [api]
    restart: unless-stopped
    init: true
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
  redis_data:
  media_data:
